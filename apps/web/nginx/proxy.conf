proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# appends the peer address to whatever arrived. a client can prepend junk to the
# list, so the api counts hops from the right (TRUST_PROXY_HOPS) and never reads
# the left end.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";

# an https upstream gets its certificate checked against the system trust store.
# off would accept any certificate at all, which makes the TLS pointless: anything
# able to answer on that address gets to be the api. inert for an http upstream,
# and left in place so switching the scheme doesn't quietly downgrade anything.
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# the api streams nothing, and buffering keeps a slow client from holding an
# upstream connection open for the whole download
proxy_buffering on;
